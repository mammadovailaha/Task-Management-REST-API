services:
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: task_api
      POSTGRES_PASSWORD: local_password
      POSTGRES_DB: task_management
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U task_api -d task_management"]
      interval: 5s
      timeout: 5s
      retries: 10
volumes:
  postgres_data:
